name: Pred insertion

on:
  workflow_dispatch:
  push:
    branches:
      - autopred_bdd

jobs:
  report:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.API_URL }}
      SUPABASE_KEY: ${{ secrets.SECRET_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r autopred_bdd/requirements.txt


      - name: Lancement de MLflow et attente
        run: |
          cd ml_satisfaction
          python train_modele_multilabel.py
          mlflow server --host 127.0.0.1 --port 5000 > mlflow.log 2>&1 &
          
          echo "Attente de MLflow..."
          timeout 30 bash -c 'until curl -s http://127.0.0.1:5000/health > /dev/null; do sleep 1; done' || (cat mlflow.log && exit 1)
          echo "MLflow est prêt !"

      - name: Lancement de l'API FastAPI et attente
        run: |
          cd fastapi_api_ia
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          
          echo "Attente de l'API..."
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000/docs > /dev/null; do sleep 1; done' || (cat uvicorn.log && exit 1)
          echo "FastAPI est opérationnelle !"

      - name: Exécution du script de prédiction
        run: |
          cd autopred_bdd
          python script.py